[package]
name = "niva-engine"
version = "1.0.0"
edition = "2021"
description = "محرك لغة Niva المستقل: مفسر Rust يمشي الشجرة، بدون Python، وبدون مترجم إلى لغة آلة في v1"
license = "MIT"

[[bin]]
name = "niva"
path = "src/main.rs"

[profile.release]
opt-level = 2

# The engine has no runtime dependencies on native targets.
# On wasm32 only, js-sys gives the browser clock (Date.now),
# because std::time::SystemTime traps on wasm32-unknown-unknown
# (it has no clock). Used only for the random seed and وقت.الآن.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
