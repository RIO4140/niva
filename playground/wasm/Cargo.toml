[package]
name = "niva-playground"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
niva-engine = { path = "../../engine" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# wasm-opt needs a binaryen download from GitHub, which this
# environment cannot fetch — the unoptimized module (400K) is
# fine for v1 of the playground.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
