<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملعب Niva — جرّب لغة برمجة بالعربي</title>
<style>
  body { font-family: system-ui, "Segoe UI", Tahoma, sans-serif; max-width: 820px; margin: 0 auto; padding: 1.5rem; line-height: 1.7; color: #1a1a1a; }
  h1 { margin-bottom: 0; }
  header p { margin-top: 0.2rem; color: #555; }
  .examples { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 1rem 0; }
  .examples button { background: #f0f0f0; border: 1px solid #ccc; border-radius: 6px; padding: 0.3rem 0.9rem; cursor: pointer; font-size: 1rem; }
  .examples button:hover { background: #e4e4e4; }
  textarea { width: 100%; box-sizing: border-box; font-family: "Cascadia Code", Consolas, monospace; font-size: 1.05rem; line-height: 1.6; padding: 0.8rem; border: 1px solid #999; border-radius: 8px; direction: ltr; text-align: left; }
  .actions { margin: 0.8rem 0; display: flex; gap: 1rem; align-items: center; }
  #run { background: #0b6e4f; color: white; border: none; border-radius: 8px; padding: 0.6rem 1.6rem; font-size: 1.1rem; cursor: pointer; }
  #run:hover { background: #095c41; }
  .hint { color: #666; font-size: 0.95rem; }
  #output { background: #111; color: #e8e8e8; padding: 1rem; border-radius: 8px; min-height: 6rem; white-space: pre-wrap; word-break: break-word; }
  #output.error { color: #ff9d9d; }
  .note { color: #666; font-size: 0.95rem; }
  footer { margin-top: 2rem; color: #777; font-size: 0.9rem; }
  a { color: #0b6e4f; }
</style>
</head>
<body>
<header>
  <h1>ملعب Niva</h1>
  <p>اكتب كودا بالعربي وشغّله في المتصفح — بلا تثبيت.</p>
</header>
<main>
  <div class="examples">
    <button data-example="hello">أهلا</button>
    <button data-example="functions">دوال</button>
    <button data-example="stdlib">مكتبة قياسية</button>
    <button data-example="classes">فئات</button>
  </div>
  <textarea id="code" rows="12" spellcheck="false"># الدرس الأول: الطباعة
اطبع "أهلا بك في Niva"
اطبع ٢ + ٣
اطبع "النتيجة:"، ١٠ * ٢</textarea>
  <div class="actions">
    <button id="run">شغّل</button>
    <span class="hint">Ctrl+Enter للتشغيل</span>
  </div>
  <pre id="output">... يحمّل المحرك ...</pre>
  <p class="note">ملاحظة: الملفات والإدخال والنوم غير مدعومة في المتصفح — الكود يعمل بلا ملفات.</p>
</main>
<footer>
  <p>Niva — لغة برمجة بالعربي. صنع بواسطة محمود عبد النبي. <a href="https://github.com/RIO4140/niva">المستودع</a></p>
</footer>
<script type="module" src="./app.js"></script>
</body>
</html>
