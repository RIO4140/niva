<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rio4140 — ملعب لغة البرمجة بالعربي</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;max-width:1000px;margin:20px auto;padding:0 16px;line-height:1.7}
  textarea,pre{width:100%;box-sizing:border-box;font-family:monospace;font-size:15px;padding:12px;border:1px solid #ccc;border-radius:8px;white-space:pre-wrap}
  textarea{min-height:220px;direction:ltr;text-align:left}
  pre{background:#f6f6f6;min-height:120px;direction:ltr;text-align:left}
  button{padding:10px 16px;margin:4px;border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer;font-size:15px}
  button.secondary{background:#eee;color:#111}
  .note{background:#fff8e1;border:1px solid #f0d98c;padding:12px;border-radius:8px}
</style>
</head>
<body>
<h1>Rio4140 — اكتب بالعربي، ويطلع Python حقيقي</h1>
<p class="note"><b>أمان:</b> الكود لا يرسل لأي سيرفر أبدا. التحويل يتم في متصفحك، والتشغيل — إن اخترته — يتم في متصفحك فقط عبر Pyodide المعزول، أو على جهازك أنت بعد تصدير ملف Python.</p>

<label>كود Rio4140:</label>
<textarea id="rio" placeholder="اطبع &quot;أهلا بك في Rio4140&quot;">اطبع "أهلا بك في Rio4140"
س = ٥
ص = ٣
اطبع س + ص
لكل رقم في مدى(٣):
    اطبع رقم</textarea>

<p>
  <button onclick="convert()">حوّل إلى Python</button>
  <button class="secondary" onclick="copyPy()">انسخ كود Python</button>
  <button class="secondary" onclick="downloadPy()">حمّل ملف .py</button>
  <button onclick="runPy()">شغّل في المتصفح</button>
</p>

<label>كود Python الناتج (جنب بعض — هذا هو التخرج):</label>
<pre id="py"></pre>

<label>نتيجة التشغيل:</label>
<pre id="out"></pre>

<script>
function stripDia(s){return s.replace(/[\u064B-\u0652\u0670\u0640]/g,'');}
function normKw(w){return stripDia(w).replace(/[أإآ]/g,'ا').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ة/g,'ه').replace(/ى/g,'ي');}
const RAW={اطبع:'print',إذا:'if',وإلا:'else',بينما:'while',لكل:'for',دالة:'def',ارجع:'return',فئة:'class',استورد:'import',من:'from',حاول:'try',ماعدا:'except',أخيرا:'finally',صحيح:'True',خطأ:'False',لاشيء:'None',و:'and',أو:'or',ليس:'not',في:'in',مرر:'pass',اكسر:'break',تابع:'continue',احذف:'del',أكد:'assert',مع:'with',باسم:'as',أثير:'raise',عالمي:'global',مدى:'range',طول:'len',مجموع:'sum',أدنى:'min',أقصى:'max',مرتب:'sorted',مطلق:'abs',افتح:'open',ادخل:'input',نوع:'type'};
const KW={}; for(const k in RAW) KW[normKw(k)]=RAW[k];
const AR_LET='\\u0621-\\u064A\\u066E-\\u06D3';
function splitLine(line){
  const strings=[]; let out='', i=0;
  while(i<line.length){
    const ch=line[i];
    if(ch==="'"||ch==='"'){
      let j=i+1;
      while(j<line.length){ if(line[j]==='\\'){j+=2;continue;} if(line[j]===ch) break; j++; }
      const lit = j<line.length ? line.slice(i,j+1) : line.slice(i);
      const ph='__RIO_STR_'+strings.length+'__'; strings.push(lit); out+=ph; i = j<line.length ? j+1 : line.length;
      continue;
    }
    if(ch==='#'){ return {code:out, strings, comment:line.slice(i)}; }
    out+=ch; i++;
  }
  return {code:out, strings, comment:''};
}
function isSpace(t){return /^\s+$/.test(t);}
function isArabWord(t){return new RegExp('^['+AR_LET+']+$').test(t);}
function translateLine(line){
  const {code, strings, comment} = splitLine(line);
  const re = new RegExp('[0-9٠-٩]+|['+AR_LET+']+|[A-Za-z_][A-Za-z0-9_]*|.','gu');
  const tokens = code.match(re) || [];
  const out=[]; let i=0;
  while(i<tokens.length){
    const tok=tokens[i];
    if(isArabWord(tok)){
      const n=normKw(tok);
      if(n===normKw('وإلا')){
        let j=i+1; while(j<tokens.length && isSpace(tokens[j])) j++;
        if(j<tokens.length && normKw(tokens[j])===normKw('إذا')){ out.push('elif'); i=j+1; continue; }
      }
      if(n===normKw('ليس')){
        let j=i+1; while(j<tokens.length && isSpace(tokens[j])) j++;
        if(j<tokens.length && normKw(tokens[j])===normKw('في')){ out.push('not in'); i=j+1; continue; }
      }
      out.push(KW[n] || stripDia(tok)); i++; continue;
    }
    if(/^[0-9٠-٩]+$/.test(tok)){ out.push(tok.replace(/[٠-٩]/g, d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))); i++; continue; }
    if(tok==='،'){ out.push(','); i++; continue; }
    if(tok==='؛'){ out.push(';'); i++; continue; }
    out.push(tok); i++;
  }
  let py=out.join('');
  const m=py.match(/^(\s*)print\s+(.+)$/);
  if(m && !m[2].trim().startsWith('(')) py=m[1]+'print('+m[2].trim()+')';
  strings.forEach((lit,idx)=>{ py=py.split('__RIO_STR_'+idx+'__').join(lit); });
  return py+comment;
}
function transpile(src){ return src.split('\n').map(translateLine).join('\n'); }
function convert(){
  const py=transpile(document.getElementById('rio').value);
  document.getElementById('py').textContent=py;
  document.getElementById('out').textContent='';
  return py;
}
function copyPy(){ const py=convert(); navigator.clipboard.writeText(py).then(()=>{document.getElementById('out').textContent='تم النسخ.';}); }
function downloadPy(){
  const py=convert();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([py+'\n'],{type:'text/plain'}));
  a.download='rio4140-program.py'; a.click();
}
let pyodide=null, loading=null;
async function runPy(){
  const py=convert();
  const outEl=document.getElementById('out');
  outEl.textContent='جارٍ تحميل بيئة التشغيل في متصفحك...';
  try{
    if(!pyodide){
      if(!loading){
        loading=new Promise((res,rej)=>{
          const s=document.createElement('script');
          s.src='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
          s.onload=async()=>{ try{ res(await loadPyodide()); }catch(e){ rej(e); } };
          s.onerror=()=>rej(new Error('load failed'));
          document.head.appendChild(s);
        });
      }
      pyodide=await loading;
    }
    let output='';
    pyodide.setStdout({batched:(s)=>{output+=s+'\n';}});
    pyodide.setStderr({batched:(s)=>{output+=s+'\n';}});
    pyodide.runPython(py);
    outEl.textContent=output || '(لا يوجد مخرجات)';
  }catch(e){
    outEl.textContent='تعذر التشغيل في المتصفح (تحتاج إنترنت أول مرة لتحميل Pyodide). الحل: حمّل ملف .py وشغّله على جهازك بـ: python3 rio4140-program.py';
  }
}
convert();
</script>
</body>
</html>
